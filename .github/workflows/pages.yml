name: Deploy Slice 1 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run qa:fast
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run qa:build
      - run: npm run qa:journeys
      - run: npm run qa:a11y
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_ANALYTICS_ENABLED: ${{ vars.NEXT_PUBLIC_ANALYTICS_ENABLED }}
          NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${{ vars.NEXT_PUBLIC_ANALYTICS_ENDPOINT }}
          NEXT_PUBLIC_COUNTER_ENABLED: ${{ vars.NEXT_PUBLIC_COUNTER_ENABLED }}
          NEXT_PUBLIC_COUNTER_ENDPOINT: ${{ vars.NEXT_PUBLIC_COUNTER_ENDPOINT }}
          NEXT_PUBLIC_COUNTER_PROJECT_ID: ${{ vars.NEXT_PUBLIC_COUNTER_PROJECT_ID }}
          NEXT_PUBLIC_GUIDE_ENDPOINT: ${{ vars.NEXT_PUBLIC_GUIDE_ENDPOINT }}
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
